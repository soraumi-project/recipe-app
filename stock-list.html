<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>材料在庫管理</title>

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

    <link rel="stylesheet" href="css/stock-list.css">
</head>

<body>
    <header class="pageHeader">

        <button type="button" id="backButton" class="backButton">
            <span class="material-symbols-outlined">
                arrow_back
            </span>
        </button>

        <h1>材料在庫管理</h1>

    </header>

    <main>
        <section class="addSection">
            <div class="stockInputRow">

                <div class="stockInputGroup">
                    <label for="stockNameInput">材料名</label>

                    <div class="voiceInputRow">
                        <input type="text" id="stockNameInput" placeholder="例：卵">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="材料名を音声入力">🎤</button>
                    </div>
                </div>

                <div class="stockInputGroup">
                    <label for="stockQuantityInput">数量</label>

                    <div class="voiceInputRow">
                        <input type="number" id="stockQuantityInput" min="0" step="1" placeholder="例：6">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="数量を音声入力">🎤</button>
                    </div>
                </div>

                <div class="stockInputGroup">
                    <label for="stockUnitInput">単位</label>

                    <div class="voiceInputRow">
                        <input type="text" id="stockUnitInput" placeholder="例：個">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="単位を音声入力">🎤</button>
                    </div>
                </div>

                <div class="stockInputGroup">
                    <label for="stockAlertInput">警告する数量</label>

                    <div class="voiceInputRow">
                        <input type="number" id="stockAlertInput" min="0" step="1" placeholder="例：2">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="警告する数量を音声入力">🎤</button>
                    </div>
                </div>
            </div>

            <button type="button" id="addStockButton">
                在庫に追加
            </button>

        </section>

        <seciton class="stockSection">
            <p id="emptyMessage">
                登録されている在庫はありません
            </p>

            <ul id="stockList"></ul>
        </seciton>

    </main>

    <script src="js/voice-input.js"></script>
    <script src="js/stock-list.js"></script>

</body>

</html>
