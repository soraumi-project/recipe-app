<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>レシピ追加</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <a href="index.html" class="backButton">← 戻る</a>
        <h1>レシピ追加</h1>
    </header>

    <main class="addPage">

        <section class="formCard">

            <!-- AI画像読み取り -->
            <div class="recipeImageImport">

                <h2>📷 ① AIでレシピを読み込む</h2>

                <p>
                    写真やスクリーンショットから、
                    料理名・材料・作り方を自動入力できます。
                </p>

                <label class="imageImportButton">
                    画像を選択
                    <input type="file" id="recipeImportImage" accept="image/*" hidden>
                </label>

                <p id="imageImportStatus"></p>

            </div>

            <div class="inputDivider">
                <span>または</span>
            </div>

            <div class="manualInputSection">
                <h2>✏️ ② 手動でレシピを入力する</h2>
                <p>
                    手動で入力することも、AIで読み込んだ内容を編集することもできます。
                </p>
            </div>


            <label>料理名</label>
            <div class="voiceInputRow">
                <input type="text" id="recipeTitle">

                <button type="button" class="voiceInputButton"
                    onclick="startVoiceInput(document.getElementById('recipeTitle'))" aria-label="料理名を音声入力">
                    🎤
                </button>
            </div>

            <label for="recipeTitleKana">よみがな</label>

            <div class="voiceInputRow">
                <input type="text" id="recipeTitleKana">

                <button type="button" class="voiceInputButton"
                    onclick="startVoiceInput(document.getElementById('recipeTitleKana'))" aria-label="よみがなを音声入力">
                    🎤
                </button>
            </div>

            <label>料理写真（最大3枚）</label>
            <label class="imageUploadBox">
                <span class="material-symbols-outlined">add_photo_alternate</span>
                <span>写真を追加する</span>
                <input type="file" id="recipeImage" accept="image/*" multiple>
            </label>

            <div id="imagePreviewArea" class="imagePreviewArea"></div>

            <label>材料名</label>

            <div id="ingredientsArea">
                <div class="ingredientRow">
                    <div class="voiceInputRow">
                        <input type="text" class="ingredientName" placeholder="材料名">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="材料名を音声入力">
                            🎤
                        </button>
                    </div>

                    <div class="voiceInputRow">
                        <input type="text" class="ingredientAmount" placeholder="分量">
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="分量を音声入力">
                            🎤
                        </button>
                    </div>
                    <button type="button" class="deleteButton">×</button>
                </div>
            </div>

            <button type="button" id="addIngredientButton" class="smallButton">
                ＋　材料を追加
            </button>

            <label>作り方</label>

            <div id="stepsArea">
                <div class="stepRow">
                    <div class="voiceInputRow">
                        <textarea class="stepInput" placeholder="手順を入力"></textarea>
                        <button type="button" class="voiceInputButton"
                            onclick="startVoiceInput(this.previousElementSibling)" aria-label="作り方を音声入力">
                            🎤
                        </button>
                    </div>

                    <button type="button" class="deleteButton">×</button>
                </div>
            </div>

            <button type="button" id="addStepButton" class="smallButton">
                ＋　手順を追加
            </button>

            <label>タグ</label>
            <div class="tagArea">
                <label><input type="radio" name="tag" value="和食">和食</label>
                <label><input type="radio" name="tag" value="洋食">洋食</label>
                <label><input type="radio" name="tag" value="中華">中華</label>
                <label><input type="radio" name="tag" value="なし" checked> なし</label>
            </div>

            <button type="button" id="addTagButton" class="smallButton">
                ＋　タグを追加
            </button>

            <button type"button" id="saveRecipeButton" class="saveButton">
                保存
            </button>

        </section>

    </main>

    <script src="js/voice-input.js"></script>
    <script src="js/recipeAdd.js"></script>

</body>

</html>
